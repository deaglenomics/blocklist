# Source catalogue for the merged Technitium blocklist.
# Schema and per-source notes: see README.md.
# The web editor (docs/index.html) rewrites this file; hand edits are fine too.

version: 1

output:
  filename: technitium-blocklist.txt
  compact_filename: technitium-blocklist-compact.txt
  adblock_filename: technitium-blocklist-adblock.txt
  title: Technitium merged blocklist
  sort: true
  compact: true
  safety_guard: true

