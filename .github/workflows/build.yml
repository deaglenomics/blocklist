name: build-blocklist

on:
  schedule:
    # TEMP one-shot test 10:48 UTC
    - cron: "48 10 10 11 *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: blocklist-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check pyyaml==6.0.2

      - name: Unit tests (parser)
        run: python3 tests/test_parser.py

      - name: Build merged list
        run: |
          python3 scripts/build_blocklist.py \
            --config config/sources.yaml \
            --allowlist config/allowlist.txt \
            --outdir dist

      - name: Verify output invariants
        run: python3 tests/test_output.py dist

      - name: Publish to dist branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish.sh dist

      # Closes the loop on the channel the resolvers actually use: fetch the public
      # release assets back over HTTP and re-run the same invariant test on them.
      # Catches a broken redirect, a stale asset, or a corrupted upload.
      - name: Verify published artifacts (delivery path)
        run: |
          set -eu
          mkdir -p published
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/blocklist"
          for f in build-report.json technitium-blocklist.txt \
                   technitium-blocklist-compact.txt technitium-blocklist-adblock.txt; do
            ok=0
            for attempt in 1 2 3 4 5; do
              if curl -fsSL --max-time 600 -o "published/$f" "$base/$f"; then ok=1; break; fi
              echo "retry $attempt for $f (asset may still be propagating)"
              sleep 10
            done
            [ "$ok" = 1 ] || { echo "ERROR: could not download $f from the release"; exit 1; }
          done
          python3 tests/test_output.py published

      - name: Job summary
        if: always()
        run: python3 scripts/summary.py dist/build-report.json >> "$GITHUB_STEP_SUMMARY"
